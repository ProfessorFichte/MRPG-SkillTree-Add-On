pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven {
            url = 'https://maven.architectury.dev/snapshots/'
            mavenContent {
                snapshotsOnly()
            }
        }
        maven { url = 'https://files.minecraftforge.net/maven/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'mrpgc_skill_tree'

include 'common'
include 'fabric'
include 'neoforge'
